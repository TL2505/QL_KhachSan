<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Hóa Đơn - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/shared/css/style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-danger mb-4 shadow">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/admin/admin.html">🏨 Quản trị hệ thống</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" href="/admin/admin.html">Báo cáo & Người dùng</a></li>
                    <li class="nav-item"><a class="nav-link active" href="/admin/invoices.html">Hóa đơn</a></li>
                </ul>
            </div>
            <div class="d-flex align-items-center text-light">
                <span id="welcomeMessage" class="me-3 fw-bold"></span>
                <button class="btn btn-sm btn-outline-light fw-bold" onclick="logout()">Đăng Xuất</button>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h4 class="fw-bold text-danger mb-0"><i class="fas fa-file-invoice-dollar me-2"></i>Quản lý Hóa Đơn (Doanh thu)</h4>
        </div>

        <div class="card shadow-sm border-0 mb-4">
            <div class="card-body">
                <div class="d-flex justify-content-between mb-3">
                    <div class="input-group" style="max-width: 400px;">
                        <span class="input-group-text bg-white"><i class="fas fa-search text-muted"></i></span>
                        <input type="text" id="searchInput" class="form-control" placeholder="Tìm theo ID, khách hàng hoặc phòng..." onkeyup="filterInvoices()">
                    </div>
                    <div>
                        <button class="btn btn-outline-secondary" onclick="loadInvoices()"><i class="fas fa-sync-alt"></i> Tải lại</button>
                    </div>
                </div>

                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead class="table-light">
                            <tr>
                                <th>Mã HĐ</th>
                                <th>Khách hàng</th>
                                <th>Phòng</th>
                                <th>Tiền dịch vụ</th>
                                <th>Tổng cộng (đã giảm)</th>
                                <th>Ngày lập</th>
                                <th>Trạng thái</th>
                                <th class="text-end">Thao tác</th>
                            </tr>
                        </thead>
                        <tbody id="invoiceTableBody">
                            <tr><td colspan="8" class="text-center">Đang tải dữ liệu...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Ẩn bản in hóa đơn tạm thời -->
    <div style="display: none;">
        <div id="printableInvoice" class="bg-white p-5 border shadow-sm mx-auto" style="width: 700px; color: #000;">
            <!-- Nội dung hóa đơn sẽ được render bằng JS -->
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/shared/js/api.js"></script>
    <script src="/admin/invoices.js"></script>
</body>
</html>
