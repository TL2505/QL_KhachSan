<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Tầm nhìn chiến lược</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-danger mb-4 shadow">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">👑 Administrator Dashboard</a>
            <div class="d-flex align-items-center text-light">
                <span id="welcomeMessage" class="me-3 fw-bold"></span>
                <button class="btn btn-sm btn-outline-light fw-bold" onclick="logout()">Đăng Xuất</button>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="row mb-4">
            <div class="col-md-12">
                <div class="alert alert-danger fw-bold border-0 shadow-sm">
                    ⚠️ QUYỀN TRUY CẬP: TÀI KHOẢN QUẢN TRỊ VIÊN CẤP CAO. CHỈ XEM BÁO CÁO, KHÔNG CAN THIỆP VẬN HÀNH.
                </div>
            </div>
        </div>

        <div class="row">
            <!-- Khu vực 1: Báo cáo tài chính -->
            <div class="col-md-8">
                <div class="dashboard-card border-top border-danger border-4">
                    <h4 class="fw-bold mb-4 text-danger">Báo cáo Doanh thu (Giả lập)</h4>
                    <div style="height: 300px; background: repeating-linear-gradient(45deg, #f8f9fa, #f8f9fa 10px, #e9ecef 10px, #e9ecef 20px);" class="rounded border d-flex align-items-center justify-content-center">
                        <span class="text-muted fw-bold">[Khu vực render Biểu đồ Chart.js]</span>
                    </div>
                </div>
            </div>

            <!-- Khu vực 2: Thống kê & Nhân sự -->
            <div class="col-md-4">
                <div class="dashboard-card mb-4 bg-danger text-white">
                    <h5 class="fw-bold">Tổng doanh thu tháng</h5>
                    <h2 class="display-6 fw-bold">125,500,000 ₫</h2>
                </div>
                
                <div class="dashboard-card border-top border-dark border-4">
                    <h5 class="fw-bold mb-3 text-dark">Quản lý Nhân sự</h5>
                    <p class="text-muted small">Thêm, sửa, khóa tài khoản STAFF.</p>
                    <button class="btn btn-dark w-100 fw-bold" onclick="alert('Tính năng đang phát triển!')">Quản lý User & Role</button>
                </div>
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const user = checkAuth();
            if(user.roleId !== 1) { // Chỉ Admin mới được vào đây
                alert("Truy cập trái phép!");
                window.location.href = "login.html";
            }
            document.getElementById("welcomeMessage").textContent = `Xin chào Sếp, ${user.fullName || user.username}!`;
        });
    </script>
</body>
</html>
