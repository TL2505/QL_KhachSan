<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bảng Điều Khiển - Web UI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4 shadow">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">🏨 Omnichannel Dashboard</a>
            <div class="d-flex align-items-center text-light">
                <span id="welcomeMessage" class="me-3"></span>
                <button class="btn btn-sm btn-danger fw-bold" onclick="logout()">Đăng Xuất</button>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="row">
            <!-- Khu vực 1: Danh sách phòng -->
            <div class="col-md-8">
                <div class="dashboard-card">
                    <h4 class="fw-bold mb-4 text-primary">Sơ đồ phòng (Room Grid)</h4>
                    <div id="roomList" class="row g-3">
                        <div class="col-12 text-center text-muted">
                            <span class="spinner-border spinner-border-sm"></span> Đang tải dữ liệu phòng...
                        </div>
                    </div>
                </div>
            </div>

            <!-- Khu vực 2: Thêm khách hàng -->
            <div class="col-md-4">
                <div class="dashboard-card">
                    <h4 class="fw-bold mb-4 text-success">Thêm Khách Hàng</h4>
                    <div id="customer-msg" class="alert d-none"></div>
                    <form id="customerForm">
                        <div class="mb-3">
                            <label class="form-label fw-bold">Họ và tên</label>
                            <input type="text" class="form-control" id="custName" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Số điện thoại</label>
                            <input type="text" class="form-control" id="custPhone" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Email (Tùy chọn)</label>
                            <input type="email" class="form-control" id="custEmail">
                        </div>
                        <button type="submit" id="btnCustomer" class="btn btn-success w-100 fw-bold">Tạo Khách Hàng</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/api.js"></script>
    <script src="js/dashboard.js"></script>
</body>
</html>
