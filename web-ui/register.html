<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký Tài khoản Khách hàng</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="d-flex align-items-center justify-content-center">

    <div class="login-card">
        <h3 class="mb-4 text-center fw-bold text-success">ĐĂNG KÝ TÀI KHOẢN</h3>
        <p class="text-center text-muted mb-4">Dành riêng cho Khách hàng (Customer)</p>

        <div id="reg-msg" class="alert d-none"></div>

        <form id="registerForm">
            <div class="mb-3">
                <label class="form-label fw-bold">Tên đăng nhập</label>
                <input type="text" class="form-control" id="regUsername" required>
            </div>
            <div class="mb-3">
                <label class="form-label fw-bold">Mật khẩu</label>
                <input type="password" class="form-control" id="regPassword" required>
            </div>
            <div class="mb-3">
                <label class="form-label fw-bold">Họ và tên</label>
                <input type="text" class="form-control" id="regFullName" required>
            </div>
            <div class="mb-4">
                <label class="form-label fw-bold">Số điện thoại</label>
                <input type="text" class="form-control" id="regPhone" required>
            </div>
            
            <button type="submit" id="btnRegister" class="btn btn-success w-100 py-2 fw-bold shadow">Tạo Tài Khoản</button>
        </form>

        <div class="mt-4 text-center">
            <a href="login.html" class="text-decoration-none">Đã có tài khoản? Đăng nhập ngay</a>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script>
        document.getElementById("registerForm").addEventListener("submit", async function(e) {
            e.preventDefault();
            const btn = document.getElementById("btnRegister");
            const msg = document.getElementById("reg-msg");
            
            btn.disabled = true;
            btn.textContent = "Đang xử lý...";
            msg.classList.add("d-none");

            try {
                // Gọi API POST /api/auth/register (Giả định Java Backend hỗ trợ)
                const res = await fetchApi('/auth/register', 'POST', {
                    username: document.getElementById("regUsername").value,
                    password: document.getElementById("regPassword").value,
                    fullName: document.getElementById("regFullName").value,
                    phone: document.getElementById("regPhone").value,
                    roleId: 3 // Ép cứng luôn là Khách hàng
                });

                if(res.status === "success" || res.message === "Đăng ký thành công") {
                    msg.className = "alert alert-success";
                    msg.textContent = "Đăng ký thành công! Đang chuyển về trang đăng nhập...";
                    setTimeout(() => window.location.href = "login.html", 2000);
                } else {
                    msg.className = "alert alert-danger";
                    msg.textContent = res.message || "Đăng ký thất bại!";
                }
            } catch (error) {
                msg.className = "alert alert-danger";
                msg.textContent = "Lỗi kết nối Máy chủ!";
            } finally {
                btn.disabled = false;
                if(msg.className !== "alert alert-success") btn.textContent = "Tạo Tài Khoản";
            }
        });
    </script>
</body>
</html>
