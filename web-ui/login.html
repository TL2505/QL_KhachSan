<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - Quản Lý Khách Sạn</title>
    <!-- Sử dụng Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="d-flex align-items-center justify-content-center">

    <div class="login-card text-center">
        <h2 class="mb-4 text-primary fw-bold">HỆ THỐNG<br>ĐĂNG NHẬP</h2>
        <p class="text-muted mb-4">Hệ thống Quản lý Khách sạn Đa Nền Tảng</p>
        
        <div id="error-message" class="alert alert-danger d-none" role="alert"></div>

        <form id="loginForm">
            <div class="mb-3 text-start">
                <label for="username" class="form-label fw-bold">Tên đăng nhập</label>
                <input type="text" class="form-control" id="username" placeholder="Nhập tên đăng nhập" required>
            </div>
            <div class="mb-4 text-start">
                <label for="password" class="form-label fw-bold">Mật khẩu</label>
                <input type="password" class="form-control" id="password" placeholder="••••••" required>
            </div>
            
            <button type="submit" id="btnLogin" class="btn btn-primary w-100 py-2 fw-bold shadow">
                Đăng nhập ngay
            </button>
        </form>

        <div class="mt-5 text-muted small">
            © 2026 Hotel Manager System | Omnichannel V2
        </div>
    </div>

    <!-- Script xử lý -->
    <script src="js/api.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
