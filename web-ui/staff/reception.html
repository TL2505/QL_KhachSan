<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Lễ tân - Hệ Thống Khách Sạn</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/shared/css/style.css">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4 shadow">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">🏨 Phân hệ Lễ tân</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link active" href="/staff/reception.html">Sơ đồ Phòng</a></li>
                    <li class="nav-item"><a class="nav-link" href="/staff/customers.html">Khách hàng</a></li>
                    <li class="nav-item"><a class="nav-link" href="/staff/rooms.html">Quản lý Phòng</a></li>
                    <li class="nav-item"><a class="nav-link" href="/staff/payment.html">Thanh toán</a></li>
                </ul>
            </div>
            <div class="d-flex align-items-center text-light">
                <span id="welcomeMessage" class="me-3"></span>
                <button class="btn btn-sm btn-danger fw-bold" onclick="logout()">Đăng Xuất</button>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="row">
            <!-- Khu vực 1: Danh sách phòng -->
            <div class="col-md-8">
                <div class="dashboard-card">
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <h4 class="fw-bold text-primary mb-0">Sơ đồ Trạng thái Phòng</h4>
                        
                        <!-- Filter Bar -->
                        <div class="d-flex gap-2">
                            <select id="filterFloor" class="form-select form-select-sm w-auto" onchange="loadRooms()">
                                <option value="all">Tất cả Tầng</option>
                                <option value="1">Tầng 1</option>
                                <option value="2">Tầng 2</option>
                                <option value="3">Tầng 3</option>
                            </select>
                            <select id="filterStatus" class="form-select form-select-sm w-auto" onchange="loadRooms()">
                                <option value="all">Tất cả Trạng thái</option>
                                <option value="available">🟢 Trống</option>
                                <option value="occupied">🔴 Đang ở</option>
                                <option value="cleaning">🟡 Đang dọn</option>
                                <option value="maintenance">🛠️ Bảo trì</option>
                            </select>
                        </div>
                    </div>

                    <div id="roomList" class="row g-3">
                        <div class="col-12 text-center text-muted">
                            <span class="spinner-border spinner-border-sm"></span> Đang tải dữ liệu phòng...
                        </div>
                    </div>
                </div>
            </div>

            <!-- Khu vực 2: Thêm khách hàng -->
            <div class="col-md-4">
                <div class="dashboard-card">
                    <h4 class="fw-bold mb-4 text-success">Thêm Khách Hàng</h4>
                    <div id="customer-msg" class="alert d-none"></div>
                    <form id="customerForm">
                        <div class="mb-3">
                            <label class="form-label fw-bold">Họ và tên</label>
                            <input type="text" class="form-control" id="custName" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Số điện thoại</label>
                            <input type="text" class="form-control" id="custPhone" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Số CCCD/Passport</label>
                            <input type="text" class="form-control" id="custCccd" required>
                        </div>
                        <button type="submit" id="btnCustomer" class="btn btn-success w-100 fw-bold">Tạo Khách Hàng</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Room Action Modal (Contextual) -->
    <div class="modal fade" id="roomActionModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header bg-dark text-white">
                    <h5 class="modal-title fw-bold" id="roomModalTitle">Thông tin Phòng</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div id="roomModalContent">
                        <div class="text-center text-muted"><span class="spinner-border spinner-border-sm"></span> Đang tải...</div>
                    </div>
                </div>
                <div class="modal-footer" id="roomModalFooter">
                    <!-- Các nút tương tác sẽ được JS render theo ngữ cảnh -->
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Đóng</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/shared/js/api.js?v=2"></script>
    <script src="/staff/reception.js?v=2"></script>
</body>
</html>
