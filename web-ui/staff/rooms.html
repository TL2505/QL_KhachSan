<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Phòng vật lý</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/shared/css/style.css">
</head>
<body class="bg-light">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4 shadow">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">🏨 Phân hệ Lễ tân</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" href="/staff/reception.html">Sơ đồ Phòng</a></li>
                    <li class="nav-item"><a class="nav-link" href="/staff/customers.html">Khách hàng</a></li>
                    <li class="nav-item"><a class="nav-link active" href="/staff/rooms.html">Quản lý Phòng</a></li>
                </ul>
            </div>
            <div class="d-flex align-items-center text-light">
                <span id="welcomeMessage" class="me-3"></span>
                <button class="btn btn-sm btn-danger fw-bold" onclick="logout()">Đăng Xuất</button>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h4 class="fw-bold text-primary mb-0"><i class="fas fa-bed me-2"></i>Danh sách Phòng vật lý</h4>
            <button class="btn btn-success fw-bold" onclick="showAddRoomModal()" id="btnAddRoom" style="display: none;">
                <i class="fas fa-plus me-2"></i>Thêm Phòng mới
            </button>
        </div>

        <div class="card shadow-sm border-0 mb-4">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead class="table-light">
                            <tr>
                                <th>ID</th>
                                <th>Số phòng</th>
                                <th>Loại phòng</th>
                                <th>Giá (VNĐ)</th>
                                <th>Trạng thái</th>
                                <th class="text-end admin-only" style="display:none;">Thao tác</th>
                            </tr>
                        </thead>
                        <tbody id="roomTableBody">
                            <tr><td colspan="6" class="text-center">Đang tải dữ liệu...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Add Room Modal (Admin Only) -->
    <div class="modal fade" id="roomModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold">Thêm Phòng mới</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="roomForm">
                        <div class="mb-3">
                            <label class="form-label fw-bold">Số phòng *</label>
                            <input type="text" class="form-control" id="roomNumber" required placeholder="VD: 101, 202">
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Loại phòng *</label>
                            <select class="form-select" id="roomTypeId" required>
                                <option value="1">Standard (Cơ bản)</option>
                                <option value="2">VIP (Cao cấp)</option>
                                <option value="3">Family (Gia đình)</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Giá phòng (VNĐ/đêm) *</label>
                            <input type="number" class="form-control" id="roomPrice" required>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
                    <button type="button" class="btn btn-primary fw-bold" onclick="saveRoom()">Thêm phòng</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/shared/js/api.js"></script>
    <script src="/staff/rooms.js"></script>
</body>
</html>
