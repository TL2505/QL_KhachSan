services:
  # ============================================================================
  # 1. Transactional Database: MariaDB 11.2 (Hardened Jammy Container)
  # ============================================================================
  mariadb:
    image: mariadb:11.2-jammy
    container_name: hotel-pms-mariadb
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-hotel_pass}
      MYSQL_DATABASE: hotel_db
      MYSQL_USER: hotel_user
      MYSQL_PASSWORD: ${DB_PASSWORD:-hotel_pass}
    volumes:
      - ./database/hotel.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - mariadb_data:/var/lib/mysql
    networks:
      - pms-internal-net
    # Ports strictly isolated to internal bridge network
    expose:
      - "3306"
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-hotel_pass}"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 10s

  # ============================================================================
  # 2. 5★ Luxury Hotel PMS Core Backend API Server (Pure Java 17 Runtime)
  # ============================================================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hotel-pms-backend
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      - DB_URL=jdbc:mysql://mariadb:3306/hotel_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh
      - DB_HOST=mariadb
      - DB_PORT=3306
      - DB_USER=hotel_user
      - DB_PASSWORD=${DB_PASSWORD:-hotel_pass}
      - DB_NAME=hotel_db
      - JWT_SECRET=${JWT_SECRET:-super_secret_jwt_key_2026_hotel_pms_5star_security}
    ports:
      - "8081:8081"
    networks:
      - pms-internal-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/api/v1/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

networks:
  pms-internal-net:
    driver: bridge

volumes:
  mariadb_data:
    name: hotel_pms_mariadb_data
