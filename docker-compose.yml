services:
  # ============================================================================
  # 1. Transactional Database: MariaDB 11.2 (Hardened Jammy Container)
  # ============================================================================
  mariadb:
    image: mariadb:11.2-jammy
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set an approved database root password}
      MYSQL_DATABASE: hotel_prod_db
      MYSQL_USER: ${DB_USER:?Set an approved application database user}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set an approved application database password}
    volumes:
      - ./database:/pms-database:ro
      - ./database/bootstrap/00-init.sh:/docker-entrypoint-initdb.d/00-init.sh:ro
      - mariadb_data:/var/lib/mysql
    networks:
      - pms-internal-net
    # Exposed to host for Desktop Swing App synchronization and VM access
    ports:
      - "3306:3306"
    expose:
      - "3306"
    healthcheck:
      test: [ "CMD", "mariadb-admin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:?Set an approved database root password}" ]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 10s

  # ============================================================================
  # 2. 5★ Luxury Hotel PMS Core Backend API Server (Pure Java 17 Runtime)
  # ============================================================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_NAME: hotel_prod_db
      DB_USER: ${DB_USER:?Set an approved application database user}
      DB_PASSWORD: ${DB_PASSWORD:?Set an approved application database password}
      HOTEL_BIND_ADDRESS: 0.0.0.0
      JWT_SECRET: ${JWT_SECRET:?Set approved JWT_SECRET configuration}
      AES_VAULT_KEY: ${AES_VAULT_KEY:?Supply an approved Base64 AES-256 vault key}
      HMAC_IDENTITY_KEY: ${HMAC_IDENTITY_KEY:-aurelia_pms_secret_identity_key_2026_prod_vault_guard}
      HOTEL_VAT_RATE: ${HOTEL_VAT_RATE:?Set approved HOTEL_VAT_RATE configuration}
      BANK_BIN: ${BANK_BIN:?Set approved BANK_BIN configuration}
      BANK_ACCOUNT_NUMBER: ${BANK_ACCOUNT_NUMBER:?Set approved BANK_ACCOUNT_NUMBER configuration}
      BANK_ACCOUNT_HOLDER: ${BANK_ACCOUNT_HOLDER:?Set approved BANK_ACCOUNT_HOLDER configuration}
      BANK_WEBHOOK_SECRET: ${BANK_WEBHOOK_SECRET:?Set approved BANK_WEBHOOK_SECRET configuration}
      MANAGER_PIN_HASH: ${MANAGER_PIN_HASH:?Set approved MANAGER_PIN_HASH configuration}
      HOTEL_LEGAL_NAME: ${HOTEL_LEGAL_NAME:?Set approved HOTEL_LEGAL_NAME configuration}
      HOTEL_LEGAL_ADDRESS: ${HOTEL_LEGAL_ADDRESS:?Set approved HOTEL_LEGAL_ADDRESS configuration}
      HOTEL_TAX_CODE: ${HOTEL_TAX_CODE:?Set approved HOTEL_TAX_CODE configuration}
      INVOICE_VERIFICATION_URL: ${INVOICE_VERIFICATION_URL:?Set approved INVOICE_VERIFICATION_URL configuration}
      HOTEL_OTP_MODE: ${HOTEL_OTP_MODE:?Set approved HOTEL_OTP_MODE configuration}
      AI_GUEST_ENABLED: false
    volumes:
      - ai_settings_data:/app/.data/ai
    ports:
      - "127.0.0.1:8081:8081"
    networks:
      - pms-internal-net
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8081/api/v1/health" ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  # 3. Web Client: Nginx Reverse Proxy & No-Build Static Server (Port 3000)
  web:
    image: nginx:1.25-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:80"
    volumes:
      - ./web-ui:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - pms-internal-net

  # ============================================================================
  # 4. AI Service: Microservice for Vision & RAG Knowledge Retrieval (Port 8082)
  # ============================================================================
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8082:8082"
    environment:
      HOME: /tmp
      MPLCONFIGDIR: /tmp/matplotlib
      AI_FACE_MATCH_THRESHOLD: ${AI_FACE_MATCH_THRESHOLD:-0.68}
    volumes:
      - ./ai-service/models:/models:ro
      - ./ai-service/knowledge_store:/knowledge:ro
    networks:
      - pms-internal-net
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8082/health" ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

networks:
  pms-internal-net:
    driver: bridge

volumes:
  mariadb_data:
  ai_settings_data:
