services:
  # ============================================================================
  # 1. Transactional Database: MariaDB 11.2 (Hardened Jammy Container)
  # ============================================================================
  mariadb:
    image: mariadb:11.2-jammy
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-hotel_dev_root_pwd_2026}
      MYSQL_DATABASE: hotel_prod_db
      MYSQL_USER: ${DB_USER:-root}
      MYSQL_PASSWORD: ${DB_PASSWORD:-hotel_dev_pwd_2026}
    volumes:
      - ./database:/pms-database:ro
      - ./database/bootstrap/00-init.sh:/docker-entrypoint-initdb.d/00-init.sh:ro
      - mariadb_data:/var/lib/mysql
    networks:
      - pms-internal-net
    # Exposed to host for Desktop Swing App synchronization and VM access
    ports:
      - "3306:3306"
    expose:
      - "3306"
    healthcheck:
      test: [ "CMD", "mariadb-admin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-hotel_dev_root_pwd_2026}" ]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 10s

  # ============================================================================
  # 2. 5★ Luxury Hotel PMS Core Backend API Server (Pure Java 17 Runtime)
  # ============================================================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_NAME: hotel_prod_db
      DB_USER: ${DB_USER:-root}
      DB_PASSWORD: ${DB_PASSWORD:-hotel_dev_pwd_2026}
      HOTEL_BIND_ADDRESS: 0.0.0.0
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_APP_PASSWORD: ${SMTP_APP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      JWT_SECRET: ${JWT_SECRET:-k8J3m9Q2vL5xP1nR7wT4yU8zB0cE6vF2aM4kP8sQ1rT=}
      AES_VAULT_KEY: ${AES_VAULT_KEY:-YXVyZWxpYV9kZWZhdWx0X2Rldl9hZXNfdmF1bHRfa2V5Xw==}
      HMAC_IDENTITY_KEY: ${HMAC_IDENTITY_KEY:-YXVyZWxpYV9kZWZhdWx0X2Rldl9obWFjX3NlY3JldF8=}
      HOTEL_VAT_RATE: ${HOTEL_VAT_RATE:-0.08}
      BANK_BIN: ${BANK_BIN:-970422}
      BANK_ACCOUNT_NUMBER: ${BANK_ACCOUNT_NUMBER:-0123456789}
      BANK_ACCOUNT_HOLDER: ${BANK_ACCOUNT_HOLDER:-KHACH SAN AURELIA}
      BANK_WEBHOOK_SECRET: ${BANK_WEBHOOK_SECRET:-dev_webhook_secret_key_1234567890}
      PAYMENT_QR_PROVIDER: ${PAYMENT_QR_PROVIDER:-payos}
      PAYOS_CLIENT_ID: ${PAYOS_CLIENT_ID:-}
      PAYOS_API_KEY: ${PAYOS_API_KEY:-}
      PAYOS_CHECKSUM_KEY: ${PAYOS_CHECKSUM_KEY:-}
      PAYOS_BANK_BIN: ${PAYOS_BANK_BIN:-}
      PAYOS_ACCOUNT_NUMBER: ${PAYOS_ACCOUNT_NUMBER:-}
      PAYOS_ACCOUNT_NAME: ${PAYOS_ACCOUNT_NAME:-}
      PAYOS_RETURN_URL: ${PAYOS_RETURN_URL:-}
      PAYOS_CANCEL_URL: ${PAYOS_CANCEL_URL:-}
      MISA_EINVOICE_ENV: ${MISA_EINVOICE_ENV:-test}
      MISA_EINVOICE_MODE: ${MISA_EINVOICE_MODE:-}
      MISA_EINVOICE_APP_ID: ${MISA_EINVOICE_APP_ID:-}
      MISA_EINVOICE_TAX_CODE: ${MISA_EINVOICE_TAX_CODE:-}
      MISA_EINVOICE_USERNAME: ${MISA_EINVOICE_USERNAME:-}
      MISA_EINVOICE_PASSWORD: ${MISA_EINVOICE_PASSWORD:-}
      MISA_EINVOICE_SERIES: ${MISA_EINVOICE_SERIES:-}
      MISA_EINVOICE_TEMPLATE_ID: ${MISA_EINVOICE_TEMPLATE_ID:-}
      MISA_EINVOICE_NAME: ${MISA_EINVOICE_NAME:-}
      HOTEL_MEDIA_PROVIDER: ${HOTEL_MEDIA_PROVIDER:-local}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_PUBLIC_BASE_URL: ${R2_PUBLIC_BASE_URL:-}
      AI_RAG_URL: http://ai-service:8082/rag/query
      MANAGER_PIN_HASH: ${MANAGER_PIN_HASH:-$2a$12$e8w.x7W9c1D0/Fk9A2gP5uXbH6wJ1Y8zK3nM5pQ7sT9vU1wX3yZ2a}
      HOTEL_LEGAL_NAME: ${HOTEL_LEGAL_NAME:-Aurelia Luxury Hotel}
      HOTEL_LEGAL_ADDRESS: ${HOTEL_LEGAL_ADDRESS:-Ha Noi}
      HOTEL_TAX_CODE: ${HOTEL_TAX_CODE:-0101234567}
      INVOICE_VERIFICATION_URL: ${INVOICE_VERIFICATION_URL:-https://meinvoice.vn/tra-cuu}
      HOTEL_OTP_MODE: ${HOTEL_OTP_MODE:-stub}
      HOTEL_MEDIA_DIR: /app/.data/media
      AI_GUEST_ENABLED: "false"
    volumes:
      - ai_settings_data:/app/.data/ai
      - room_media_data:/app/.data/media
    ports:
      - "8081:8081"
    networks:
      - pms-internal-net
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://127.0.0.1:8081/api/v1/health" ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 20s

  # 3. Web Client: Nginx Reverse Proxy & No-Build Static Server (Port 3000)
  web:
    image: nginx:1.25-alpine
    restart: unless-stopped
    ports:
      - "3000:80"
    volumes:
      - ./web-ui:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - pms-internal-net

  # ============================================================================
  # 4. AI Service: Microservice for Vision & RAG Knowledge Retrieval (Port 8082)
  # ============================================================================
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    restart: unless-stopped
    command: >
      sh -c "if [ -f /run/secrets/ai_server_cert ]; then
        exec python -m uvicorn app:app --host 0.0.0.0 --port 8082 --workers 1 --no-access-log --ssl-certfile /run/secrets/ai_server_cert --ssl-keyfile /run/secrets/ai_server_key --ssl-ca-certs /run/secrets/ai_ca --ssl-cert-reqs 2;
      else
        exec python -m uvicorn app:app --host 0.0.0.0 --port 8082 --workers 1 --no-access-log;
      fi"
    ports:
      - "8083:8082"
    environment:
      HOME: /tmp
      MPLCONFIGDIR: /tmp/matplotlib
      AI_FACE_MATCH_THRESHOLD: ${AI_FACE_MATCH_THRESHOLD:-0.68}
    volumes:
      - ./ai-service/models:/models:ro
      - ./ai-service/knowledge_store:/knowledge:ro
    networks:
      - pms-internal-net
    healthcheck:
      test: [ "CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8082/health')\" || curl -f http://127.0.0.1:8082/health" ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 15s

networks:
  pms-internal-net:
    driver: bridge

volumes:
  mariadb_data:
  ai_settings_data:
  room_media_data:
