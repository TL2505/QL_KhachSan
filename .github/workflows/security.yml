name: TASK-D4.1 DevSecOps Vulnerability Scan & Production Hardening

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =========================================================================
  # JOB 1: OWASP DEPENDENCY-CHECK MAVEN AUDIT
  # =========================================================================
  dependency-audit:
    name: OWASP Dependency Vulnerability Audit
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java 17 (Eclipse Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Cache OWASP Dependency-Check NVD Database
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: owasp-nvd-data-${{ runner.os }}-${{ hashFiles('pom.xml') }}
          restore-keys: |
            owasp-nvd-data-${{ runner.os }}-

      - name: Execute OWASP Dependency-Check (Fail on CVSS >= 7.0)
        run: |
          mvn org.owasp:dependency-check-maven:check \
            -DfailBuildOnCVSS=7.0 \
            -Dformat=ALL \
            -DautoUpdate=true \
            -DsuppressionFile=owasp-suppressions.xml

      - name: Upload OWASP Vulnerability Scan Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owasp-dependency-check-report
          path: |
            target/dependency-check-report.html
            target/dependency-check-report.json
            target/dependency-check-report.csv
          retention-days: 14

  # =========================================================================
  # JOB 2: TRIVY CONTAINER IMAGE SECURITY SCAN
  # =========================================================================
  container-scan:
    name: Trivy Container Image Security Scan
    runs-on: ubuntu-latest
    needs: dependency-audit
    timeout-minutes: 20

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Hardened Container Image
        run: |
          docker build -t qlkhachsan-backend:latest .

      - name: Run Aqua Security Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'qlkhachsan-backend:latest'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Generate Trivy SARIF Report for GitHub Security Tab
        if: always()
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'qlkhachsan-backend:latest'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy Scan Results Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-container-scan-report
          path: trivy-results.sarif
          retention-days: 14
