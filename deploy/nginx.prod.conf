server {
    listen 80;
    server_name _;
    return 308 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name _;
    ssl_certificate /run/secrets/nginx_tls_cert;
    ssl_certificate_key /run/secrets/nginx_tls_key;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 14m;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
    add_header Content-Security-Policy "default-src 'self' 'unsafe-inline' 'unsafe-eval' data: blob: https:; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.tailwindcss.com https://cdn.jsdelivr.net https://unpkg.com https://accounts.google.com https://connect.facebook.net; connect-src 'self' http://localhost:8081 http://127.0.0.1:8081 http://192.168.56.102:8081 https://accounts.google.com https://*.google.com https://*.facebook.com https://*.facebook.net; frame-src 'self' https://accounts.google.com https://*.facebook.com; img-src 'self' data: blob: https:;" always;
    root /usr/share/nginx/html;
    location / { 
        try_files $uri $uri/ /index.html; 
        add_header Cache-Control "no-cache, must-revalidate" always;
    }
    location /api/ {
        proxy_pass http://backend:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 5s;
        proxy_connect_timeout 3s;

        # Dynamic CORS origin reflection for localhost, 127.0.0.1, and 192.168.56.*
        set $cors_origin "";
        if ($http_origin ~* "^https?://(localhost|127\.0\.0\.1|192\.168\.56\.[0-9]+)(:[0-9]+)?$") {
            set $cors_origin $http_origin;
        }

        if ($cors_origin != "") {
            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Credentials "true" always;
        }
        if ($cors_origin = "") {
            add_header Access-Control-Allow-Origin * always;
        }
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-User-Role, Idempotency-Key, X-Signature, ngrok-skip-browser-warning" always;

        if ($request_method = OPTIONS) {
            return 204;
        }
    }
}
