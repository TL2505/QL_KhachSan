services:
  mariadb:
    image: ${PMS_MARIADB_IMAGE:?Supply an approved MariaDB 11 image digest}
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD_FILE: /run/secrets/db_root_password
    secrets: [db_root_password]
    volumes: [pms_database:/var/lib/mysql]
    networks: [pms_internal]
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 5s
      timeout: 3s
      retries: 12
  backend:
    build: .
    restart: unless-stopped
    depends_on:
      mariadb: {condition: service_healthy}
    env_file:
      - ${PMS_BACKEND_ENV_FILE:?Supply reviewed production PMS configuration}
    environment:
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_NAME: ${PMS_DB_NAME:?Supply the pre-provisioned PMS schema}
      DB_USER: ${PMS_DB_USER:?Supply a least-privilege PMS user}
      DB_PASSWORD_FILE: /run/secrets/db_password
      JWT_SECRET_FILE: /run/secrets/jwt_secret
      AES_VAULT_KEY_FILE: /run/secrets/aes_vault_key
      HMAC_IDENTITY_KEY_FILE: /run/secrets/hmac_identity_key
      AI_SERVICE_URL: https://ai-service:8082
      AI_TLS_KEYSTORE_FILE: /run/secrets/ai_client_identity
      AI_TLS_TRUSTSTORE_FILE: /run/secrets/ai_client_trust
      AI_TLS_PASSWORD_FILE: /run/secrets/ai_tls_password
      AI_FACE_MATCH_THRESHOLD: ${AI_FACE_MATCH_THRESHOLD:-0.68}
      AI_GUEST_ENABLED: ${AI_GUEST_ENABLED:-false}
      TRUSTED_PROXY_IPS: ${PMS_PROXY_IP:?Supply the internal Nginx address}
    secrets: [db_password, jwt_secret, aes_vault_key, hmac_identity_key, ai_client_identity, ai_client_trust, ai_tls_password, ai_ca]
    volumes: [pms_invoices:/app/invoices]
    tmpfs: [/tmp:size=64m]
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    networks: [pms_internal]
    healthcheck:
      test: [CMD, curl, -fsS, --max-time, '2', 'http://127.0.0.1:8081/api/v1/health']
      interval: 5s
      timeout: 3s
      retries: 12
  ai-service:
    build: ./ai-service
    restart: unless-stopped
    mem_limit: 1500000000
    memswap_limit: 1500000000
    cpus: 2.0
    read_only: true
    tmpfs: [/tmp:size=128m]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    environment:
      HOME: /tmp
      MPLCONFIGDIR: /tmp/matplotlib
      AI_FACE_MATCH_THRESHOLD: ${AI_FACE_MATCH_THRESHOLD:-0.68}
    volumes:
      - ${PMS_AI_MODELS_DIR:?Supply approved local models}:/models:ro
      - ${PMS_AI_KNOWLEDGE_DIR:?Supply approved SOP indexes}:/knowledge:ro
    secrets: [ai_server_cert, ai_server_key, ai_ca]
    networks: [pms_internal]
    healthcheck:
      test: [CMD, python, -c, "import socket; socket.create_connection(('127.0.0.1',8082),2).close()"]
      interval: 5s
      timeout: 3s
      start_period: 15s
      retries: 12
  nginx:
    image: ${PMS_NGINX_IMAGE:?Supply an approved Nginx image digest}
    restart: unless-stopped
    depends_on:
      backend: {condition: service_healthy}
    ports: ['80:80', '443:443']
    volumes:
      - ./deploy/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./web-ui/public:/usr/share/nginx/html:ro
      - ./web-ui/portal.html:/usr/share/nginx/html/portal.html:ro
      - ./web-ui/portal-app.js:/usr/share/nginx/html/portal-app.js:ro
      - ./web-ui/portal.css:/usr/share/nginx/html/portal.css:ro
      - ./web-ui/portal-customer.css:/usr/share/nginx/html/portal-customer.css:ro
      - ./web-ui/portal-theme.css:/usr/share/nginx/html/portal-theme.css:ro
    secrets: [nginx_tls_cert, nginx_tls_key]
    networks:
      pms_internal:
        ipv4_address: ${PMS_PROXY_IP:?Supply the internal Nginx address}
    healthcheck:
      test: [CMD, nginx, -t]
      interval: 10s
      timeout: 3s
      retries: 3
networks:
  pms_internal:
    driver: bridge
    ipam:
      config:
        - subnet: ${PMS_NETWORK_SUBNET:?Supply an approved private subnet}
volumes:
  pms_database:
    external: true
    name: ${PMS_DB_VOLUME:?Supply the pre-provisioned database volume; no seed data is imported}
  pms_invoices:
secrets:
  db_root_password: {file: '${PMS_DB_ROOT_PASSWORD_FILE:?Required secret file}'}
  db_password: {file: '${PMS_DB_PASSWORD_FILE:?Required secret file}'}
  jwt_secret: {file: '${PMS_JWT_SECRET_FILE:?Required secret file}'}
  aes_vault_key: {file: '${PMS_AES_VAULT_KEY_FILE:?Required secret file}'}
  hmac_identity_key: {file: '${PMS_HMAC_IDENTITY_KEY_FILE:?Required secret file}'}
  ai_client_identity: {file: '${PMS_AI_CLIENT_IDENTITY_FILE:?Required PKCS12 identity}'}
  ai_client_trust: {file: '${PMS_AI_CLIENT_TRUST_FILE:?Required PKCS12 trust store}'}
  ai_tls_password: {file: '${PMS_AI_TLS_PASSWORD_FILE:?Required secret file}'}
  ai_server_cert: {file: '${PMS_AI_SERVER_CERT_FILE:?Required PEM certificate}'}
  ai_server_key: {file: '${PMS_AI_SERVER_KEY_FILE:?Required PEM private key}'}
  ai_ca: {file: '${PMS_AI_CA_FILE:?Required PEM CA chain}'}
  nginx_tls_cert: {file: '${PMS_NGINX_TLS_CERT_FILE:?Required approved web certificate}'}
  nginx_tls_key: {file: '${PMS_NGINX_TLS_KEY_FILE:?Required approved web private key}'}
