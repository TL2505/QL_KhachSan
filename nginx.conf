server {
    listen 80;
    
    # 1. Static Web UI files
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }
    
    # 2. Reverse proxy for backend APIs
    location /api/ {
        proxy_pass http://backend:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-User-Role guest;

       # -------------------------------------------------------------
        # QUAN TRỌNG: Ẩn các header CORS từ Backend để tránh bị nhân đôi
        # -------------------------------------------------------------
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header Access-Control-Max-Age;

        # -------------------------------------------------------------
        # Nginx tự chịu trách nhiệm phản chiếu Origin động theo Whitelist
        # -------------------------------------------------------------
        set $cors_origin "";
        if ($http_origin ~* "^https?://(localhost|127\.0\.0\.1|192\.168\.56\.[0-9]+)(:[0-9]+)?$") {
            set $cors_origin $http_origin;
        }

        if ($cors_origin != "") {
            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Credentials "true" always;
        }
        if ($cors_origin = "") {
            add_header Access-Control-Allow-Origin * always;
        }

        # Standard CORS proxy headers
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-User-Role, Idempotency-Key, X-Signature, ngrok-skip-browser-warning" always;
        
        if ($request_method = OPTIONS) {
            return 204;
        }
    }
}

