server {
    listen 80;
    client_max_body_size 8m;

    # Embedded Docker DNS resolver for dynamic name resolution at request time
    resolver 127.0.0.11 valid=10s ipv6=off;
    
    # 1. Static Web UI files
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }
    
    # 2. Reverse proxy for backend APIs with dynamic upstream and host fallback
    location /api/ {
        set $backend_upstream "http://backend:8081";
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-User-Role guest;

        # Standard CORS proxy headers
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-User-Role, Idempotency-Key, X-Signature, ngrok-skip-browser-warning" always;
        
        if ($request_method = OPTIONS) {
            return 204;
        }

        # Intercept connection errors when backend container is down, fallback to host machine
        proxy_intercept_errors on;
        error_page 502 503 504 = @fallback_host;
    }

    # 3. Fallback to Localhost / IDE Backend running on Host machine
    location @fallback_host {
        set $host_upstream "http://host.docker.internal:8081";
        proxy_pass $host_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-User-Role guest;

        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-User-Role, Idempotency-Key, X-Signature, ngrok-skip-browser-warning" always;

        if ($request_method = OPTIONS) {
            return 204;
        }
    }
}
