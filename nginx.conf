server {
    listen 80;

    # 1. Static Web UI files
    location / {
        root /usr/share/nginx/html;
        index index.html portal.html;
        try_files $uri $uri/ /portal.html;
        add_header Cache-Control "no-cache, must-revalidate" always;

        # Cấp phép tải Google Identity, Facebook SDK, DaisyUI, Tailwind và Font Google
        add_header Content-Security-Policy "default-src 'self' data: blob: https:; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.tailwindcss.com https://cdn.jsdelivr.net https://unpkg.com https://accounts.google.com https://connect.facebook.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; font-src 'self' https://fonts.gstatic.com data:; frame-src 'self' https://accounts.google.com https://*.facebook.com; connect-src 'self' http://localhost:8081 http://127.0.0.1:8081 http://192.168.56.102:8081 https://accounts.google.com https://*.google.com https://*.facebook.com https://*.facebook.net https://unpkg.com;" always;
    }

    # 2. Reverse proxy for backend APIs
    location /api/ {
        proxy_pass http://backend:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-User-Role guest;

        # 1. Ẩn toàn bộ header CORS từ Backend Java để Nginx quản trị duy nhất
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header Access-Control-Max-Age;

        # 2. Nhận diện Origin hợp lệ (Localhost & Mạng ảo 192.168.56.x)
        set $cors_origin "";
        if ($http_origin ~* "^https?://(localhost|127\.0\.0\.1|192\.168\.56\.[0-9]+)(:[0-9]+)?$") {
            set $cors_origin $http_origin;
        }

        # 3. Phản hồi Preflight OPTIONS (Trả về 204 kèm đầy đủ header CORS)
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Credentials "true" always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-User-Role, Idempotency-Key, X-Signature, ngrok-skip-browser-warning" always;
            add_header Access-Control-Max-Age 86400 always;
            add_header Content-Length 0;
            add_header Content-Type "text/plain; charset=UTF-8";
            return 204;
        }

        # 4. Gắn header CORS cho các request thực tế (GET, POST, PUT, DELETE)
        if ($cors_origin != "") {
            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Credentials "true" always;
        }
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-User-Role, Idempotency-Key, X-Signature, ngrok-skip-browser-warning" always;
    }
}
